services:
  - type: web
    name: akisto-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEETS_RANGE
        value: A1:IZ
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CACHE_ADMIN_TOKEN
        generateValue: true
      - key: API_RATE_LIMIT
        value: "1200"
      - key: LOGIN_RATE_LIMIT
        value: "30"
      - key: COMPANY_LOOKUP_RATE_LIMIT
        value: "60"
      - key: ALLOW_MOCK_DATA
        value: "false"
      - key: ALLOW_LEGACY_QUERY_AUTH
        value: "false"
      - key: ALLOW_LEGACY_PASSWORD_HASHES
        value: "false"

  - type: web
    name: akisto-portal
    runtime: static
    rootDir: react-front
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
